[package]
name = "xbrowsersync-api-rs"
version = "2.0.0"
edition = "2021"
license = "GPL-3.0-only"
description = "xBrowserSync-compatible bookmark sync REST API (Rust + SQLite)"
repository = "https://github.com/xbrowsersync/api"

[dependencies]
axum = { version = "0.8", features = ["http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[dev-dependencies]
tower = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
